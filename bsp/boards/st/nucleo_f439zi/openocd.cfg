# NUCLEO-F439ZI: on-board ST-LINK/V2-1, SWD and hardware reset.
source [find board/st_nucleo_f4.cfg]

# Conservative speed for reliable connections, including early startup.
adapter speed 950

# The stock STM32F4 script changes the PLL and adapter speed on reset init.
# Leave the MCU on its reset clock; firmware owns clock configuration.
$_TARGETNAME configure -event reset-start { adapter speed 950 }
$_TARGETNAME configure -event reset-init { adapter speed 950 }

# Keep the debugger accessible only from this machine.
bindto 127.0.0.1
